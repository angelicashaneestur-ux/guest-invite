<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join My Celebration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE6D8; }
  body {
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100dvh;
  }
  #app {
    width: 100%;
    max-width: 480px;
    background: #EFE9DC;
    min-height: 100dvh;
    position: relative;
    overflow: hidden;
  }
  button { cursor: pointer; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); } 50% { box-shadow: 0 0 0 8px rgba(255,255,255,0); } }

  .screen { min-height: 100dvh; }
  .fade-up { animation: fadeUp .6s ease both; }
  .pop-in { animation: popIn .5s cubic-bezier(.2,1.4,.4,1) both; }
  .pulse-glow { animation: pulseGlow 2.2s ease-in-out .6s infinite; }

  /* ---- Opening screen ---- */
  .screen-opening {
    position: relative;
    height: 100dvh;
    overflow: hidden;
  }
  .screen-opening img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    position: absolute; inset: 0;
  }
  .screen-opening .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(30,42,58,0.1) 30%, rgba(28,38,52,0.95) 100%);
  }
  .screen-opening .copy {
    position: absolute; left: 24px; right: 24px;
    bottom: calc(40px + env(safe-area-inset-bottom));
  }
  .screen-opening .eyebrow {
    color: var(--accent);
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 20px; letter-spacing: 0.5px;
  }
  .screen-opening .headline {
    color: #fff;
    font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: 38px; line-height: 1.1; margin-top: 4px;
  }
  .btn-primary-light {
    margin-top: 26px; width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: #fff; color: #2B2118; font-size: 15.5px; font-weight: 700;
    letter-spacing: 0.3px; font-family: 'DM Sans', sans-serif;
    transition: transform .15s ease;
  }
  .btn-primary-light:hover { transform: scale(1.02); }
  .btn-primary-light:active { transform: scale(0.98); }

  /* ---- Shared: photo-collage screens (invite / rsvp / confirmed / reception) ---- */
  .screen-photo-bg {
    position: relative; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .scroll-content {
    position: relative; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column;
  }
  .card-white {
    position: relative; width: 100%; box-sizing: border-box;
    background: rgba(255,255,255,0.94); border-radius: 16px; padding: 20px; border: 1px solid #E4DAC2;
  }
  .invite-msg { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; line-height: 1.5; color: #3E3626; margin: 0; }
  .question { font-family: 'Cormorant Garamond', serif; font-weight: 600; color: #2B2118; font-size: 26px; margin-top: 0; line-height: 1.2; }
  .rsvp-text { font-size: 14px; line-height: 1.6; color: #5A4F3B; margin-top: 10px; }
  .title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px; color: #2B2118; }
  .body-text { font-size: 14.5px; line-height: 1.7; color: #5A4F3B; margin-top: 10px; }

  .card-event {
    position: relative;
    background: var(--accent); border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .card-event .title { color: #fff; font-size: 20px; margin-top: 0; }
  .card-event .row { display: flex; gap: 12px; align-items: flex-start; }
  .card-event .label { color: #fff; font-size: 13px; font-weight: 700; width: 60px; flex: none; }
  .card-event .value { color: rgba(255,255,255,0.94); font-size: 13.5px; font-weight: 500; }

  .btn-primary-dark {
    position: relative;
    margin-top: 4px; width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: #2B2118; color: #F5EFE1; font-size: 15.5px; font-weight: 700;
    letter-spacing: 0.3px; font-family: 'DM Sans', sans-serif;
  }
  .btn-back {
    position: relative;
    align-self: flex-start; border: none; background: none; color: #6B5E42;
    font-size: 14px; font-weight: 600; padding: 8px 0; font-family: 'DM Sans', sans-serif;
  }
  .btn-accept {
    position: relative;
    width: 100%; padding: 18px; border: none; border-radius: 14px; background: var(--accent);
    color: #fff; font-size: 16px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    transition: transform .15s ease;
  }
  .btn-accept:hover { transform: scale(1.02); }
  .btn-accept:active { transform: scale(0.97); }
  .btn-decline-solid {
    position: relative;
    width: 100%; padding: 18px; border: 1px solid #C9BCA0; border-radius: 14px; background: rgba(255,255,255,0.9);
    color: #6B5E42; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif;
  }

  .badge {
    width: 76px; height: 76px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .badge span { color: #fff; font-size: 34px; line-height: 1; }
  .card-note {
    position: relative; width: 100%; background: #FEFDF9; border: 1px solid #EFE7D3; border-radius: 16px;
    padding: 16px 20px; margin-top: 16px; text-align: left;
  }
  .gift-card {
    position: relative;
    width: 100%; background: #fff; border-radius: 16px; padding: 18px 20px; margin-top: 20px;
    border: 1px solid #E4DAC2; text-align: left;
  }
  .gift-card .heading {
    font-size: 12.5px; letter-spacing: 1.2px; text-transform: uppercase; color: #8A7B5C; font-weight: 700;
  }

  /* ---- Reception screen ---- */
  .screen-reception { background: #F4EEE0; }
  .checker-corner {
    position: absolute; width: 70px; height: 70px;
    background: repeating-conic-gradient(#1c2634 0% 25%, #fff 0% 50%) 0 0/20px 20px;
    opacity: 0.9;
  }
  .checker-corner--tl { top: -10px; left: -10px; border-radius: 0 0 24px 0; }
  .checker-corner--tr { top: -10px; right: -10px; border-radius: 0 0 0 24px; }
  .checker-corner--bl { bottom: -10px; left: -10px; border-radius: 0 24px 0 0; }
  .checker-corner--br { bottom: -10px; right: -10px; border-radius: 24px 0 0 0; }
  .stop-card {
    width: 100%; display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,0.92); border-radius: 16px; padding: 14px 18px;
  }
  .stop-time { display: flex; align-items: center; gap: 8px; color: #1c2634; font-size: 14px; font-weight: 700; justify-content: center; }
  .stop-name { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #3E3626; margin-top: 6px; text-align: center; }
  .stop-label { font-size: 12px; color: #8A7B5C; margin-top: 2px; }
  .reception-note {
    margin-top: 24px; width: 100%; padding: 16px 20px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; color: #1c2634; text-align: center;
  }

  /* ---- Closing screen ---- */
  .screen-closing { position: relative; height: 100dvh; overflow: hidden; }
  .screen-closing img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .screen-closing .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(28,38,52,0) 45%, rgba(28,38,52,0.9) 100%);
  }
  .closing-copy { position: absolute; left: 24px; right: 24px; bottom: 44px; text-align: center; }
  .closing-signoff { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: #fff; }
  .closing-name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 32px; color: #fff; margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
